name: Build Image - Playwright

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash
    working-directory: ./playwright

env:
  REGISTRY: ghcr.io
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  PLAYWRIGHT_BROWSERS_PATH: 0

jobs:
  build-jar:
    runs-on: ubuntu-latest
    name: Build JAR

    steps:
      - uses: actions/checkout@v3.6.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v3.13.0
        with:
          distribution: 'corretto'
          java-version: '11'

      # - name: Logging
      #   run: |
      #     pwd
      #     java -version
      #     mvn --version

      - run: mvn clean package -DskipTests

      - uses: actions/upload-artifact@v4.1.0
        with:
          name: app
          path: playwright/target/*.jar

  build-image:
    runs-on: ubuntu-latest
    needs: build-jar
    name: Build Image

    steps:
      - uses: actions/checkout@v3.6.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4.1.0
        with:
          name: app
          path: playwright/artifact/

      # - name: Logging
      #   run: |
      #     pwd
      #     ls -alR artifact/
      #     docker --version

      - name: Log in to the Container registry
        uses: docker/login-action@v3.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUSH_TO_REGISTRY }}

      - run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/playwright:1.0.0 .

      - run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/playwright:1.0.0
